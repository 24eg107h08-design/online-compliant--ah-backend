# ===================================================================
# Online Complaint Management System - Application Configuration
# ===================================================================

server.port=8080

# Application Name
spring.application.name=Online Complaint Management System

# ===================================================================
# Database Configuration (MySQL by default, configurable via ENV)
# ===================================================================
# To override with environment variables:
# set DB_URL=jdbc:mysql://localhost:3306/complaint_db
# set DB_USERNAME=root
# set DB_PASSWORD=your_password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Abhirao@4}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===================================================================
# File Upload Configuration
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
# Upload directory path relative to project root
app.upload.dir=uploads

# ===================================================================
# JWT (JSON Web Token) Security Settings
# ===================================================================
# 256-bit secure secret key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours in milliseconds (86400000)
app.jwt.expiration-milliseconds=86400000

# ===================================================================
# CORS Configuration (Allowed origins)
# ===================================================================
app.cors.allowed-origins=*

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.cms=INFO
logging.level.org.springframework.security=WARN
